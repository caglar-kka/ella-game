<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ellas Eichhörnchen-Abenteuer</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; background: #87CEEB; touch-action: none; 
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; 
        }
        canvas { display: block; }
        
        /* UI für Punkte und Rekord */
        #ui {
            position: absolute; top: 15px; width: 100%;
            display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box;
            font-size: clamp(20px, 4vw, 30px); font-weight: bold; color: #ff69b4; 
            text-shadow: 2px 2px 0px #fff; pointer-events: none; z-index: 10;
        }

        /* Der Rote Stopp-Knopf (oben rechts) */
        #stopButton {
            position: absolute;
            top: 15px;
            right: 20px; /* Rechts neben dem Rekord, oder darunter wenn Platz eng ist */
            background: #ff4444;
            color: white;
            border: 3px solid white;
            border-radius: 50%; /* Macht ihn rund */
            width: 50px;
            height: 50px;
            font-size: 25px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
            z-index: 100;
            display: none; /* Erstmal versteckt */
            align-items: center;
            justify-content: center;
            font-family: sans-serif;
        }
        #stopButton:active { transform: scale(0.9); background: #cc0000; }

        /* Overlays (Start, Pause, Gewonnen) */
        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.9);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 20; text-align: center;
        }

        h1 {
            font-size: clamp(40px, 8vw, 70px); color: #ff1493; margin: 0;
            text-shadow: 3px 3px 0px #fff; animation: bounce 1s infinite alternate;
        }

        p { font-size: 24px; color: #333; margin: 20px; }

        button.menu-btn {
            background: #ff69b4; color: white; border: 4px solid #fff;
            padding: 15px 40px; font-size: 30px; border-radius: 50px;
            font-family: inherit; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        button.menu-btn:active { transform: scale(0.95); }

        @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.1); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop>
        <source src="musik.mp3" type="audio/mpeg">
    </audio>

    <button id="stopButton" onclick="stopGame()">X</button>

    <div id="ui">
        <div>Punkte: <span id="score">0</span></div>
        <div style="margin-right: 60px;">Rekord: <span id="highscore">0</span></div> 
        </div>

    <div id="startScreen" class="overlay">
        <h1>Hallo Ella!</h1>
        <p>Fang die Nüsse & Kronen!</p>
        <button class="menu-btn" onclick="startGame()">Los geht's ▶</button>
    </div>

    <div id="milestoneScreen" class="overlay hidden">
        <h1>SUPER!</h1>
        <p><span id="milestoneScore">100</span> Punkte erreicht!</p>
        <button class="menu-btn" onclick="continueGame()">Weiter spielen ↺</button>
        <br><br>
        <button class="menu-btn" style="background:#ff4444; font-size:20px; padding:10px 30px;" onclick="stopGame()">Beenden</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');
        const milestoneScreen = document.getElementById('milestoneScreen');
        const milestoneText = document.getElementById('milestoneScore');
        const startScreen = document.getElementById('startScreen');
        const stopBtn = document.getElementById('stopButton');
        const music = document.getElementById('bgMusic');

        // BILDER LADEN
        const imgWald = new Image(); imgWald.src = 'wald.png';
        const imgEich = new Image(); imgEich.src = 'eich.png';
        const imgNuss = new Image(); imgNuss.src = 'nuss.png';
        const imgKrone = new Image(); imgKrone.src = 'krone.png';

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // SPIEL VARIABLEN
        let score = 0;
        let highscore = localStorage.getItem('ella_highscore') || 0;
        let gameRunning = false;
        let nextMilestone = 100; 

        highscoreEl.innerText = highscore;

        let squirrel = { 
            x: canvas.width / 2, y: 0, w: 150, h: 150, targetX: canvas.width / 2 
        };
        let items = [];

        // STEUERUNG
        const handleMove = (e) => {
            if (!gameRunning) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            squirrel.targetX = clientX;
        };
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove, {passive: false});
        window.addEventListener('touchstart', handleMove, {passive: false});

        function startGame() {
            startScreen.classList.add('hidden');
            milestoneScreen.classList.add('hidden');
            stopBtn.style.display = "flex"; // X-Knopf anzeigen
            
            score = 0;
            nextMilestone = 100;
            scoreEl.innerText = score;
            items = [];
            gameRunning = true;
            
            // Musik an
            music.currentTime = 0;
            music.volume = 0.4;
            music.play().catch(e => console.log("Audio braucht User-Interaktion"));
            
            loop();
        }

        function stopGame() {
            gameRunning = false;
            stopBtn.style.display = "none"; // X-Knopf verstecken
            milestoneScreen.classList.add('hidden');
            startScreen.classList.remove('hidden'); // Zurück zum Start
            
            // Musik aus
            music.pause();
            music.currentTime = 0;
        }

        function showMilestone() {
            gameRunning = false; 
            milestoneText.innerText = score;
            milestoneScreen.classList.remove('hidden');
            stopBtn.style.display = "none"; // X-Knopf kurz weg, dafür Menü
            
            playTone(600, "triangle"); 
            playTone(800, "sine");
        }

        function continueGame() {
            milestoneScreen.classList.add('hidden');
            stopBtn.style.display = "flex"; // X-Knopf wieder da
            gameRunning = true;
            nextMilestone += 100; 
            loop();
        }

        function spawnItem() {
            if (!gameRunning) return;
            const isKrone = Math.random() < 0.25;
            items.push({
                x: Math.random() * (canvas.width - 60),
                y: -100,
                type: isKrone ? 'krone' : 'nuss',
                speed: (1.5 + Math.random() * 2) * (canvas.height / 800), 
                size: isKrone ? 80 : 70
            });
        }

        function update() {
            if (!gameRunning) return;

            squirrel.y = canvas.height - 160; 
            squirrel.x += (squirrel.targetX - squirrel.x) * 0.1;

            for (let i = items.length - 1; i >= 0; i--) {
                let it = items[i];
                it.y += it.speed;

                if (it.y + it.size > squirrel.y + 30 &&
                    it.x < squirrel.x + squirrel.w/2 &&
                    it.x + it.size > squirrel.x - squirrel.w/2) {
                    
                    score += (it.type === 'krone' ? 20 : 5);
                    scoreEl.innerText = score;
                    items.splice(i, 1);
                    playTone(it.type === 'krone' ? 800 : 500, "sine");

                    if (score > highscore) {
                        highscore = score;
                        localStorage.setItem('ella_highscore', highscore);
                        highscoreEl.innerText = highscore;
                    }

                    if (score >= nextMilestone) showMilestone();

                } else if (it.y > canvas.height) {
                    items.splice(i, 1);
                }
            }
            if (Math.random() < 0.015) spawnItem();
        }

        function loop() {
            if (!gameRunning) return;

            if (imgWald.complete && imgWald.naturalWidth !== 0) {
                ctx.drawImage(imgWald, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#87CEEB"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            items.forEach(it => {
                const img = it.type === 'krone' ? imgKrone : imgNuss;
                if (img.complete) ctx.drawImage(img, it.x, it.y, it.size, it.size);
            });

            if (imgEich.complete) {
                ctx.drawImage(imgEich, squirrel.x - squirrel.w/2, squirrel.y, squirrel.w, squirrel.h);
            }

            update();
            requestAnimationFrame(loop);
        }
        
        function drawStatic() {
            if (imgWald.complete) ctx.drawImage(imgWald, 0, 0, canvas.width, canvas.height);
            if (!gameRunning) requestAnimationFrame(drawStatic);
        }
        drawStatic();

        function playTone(freq, type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }
    </script>
</body>
</html>
