<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ellas Eichhörnchen-Abenteuer</title>
    <style>
        body { margin: 0; padding: 0; overflow: hidden; background: #87CEEB; touch-action: none; font-family: 'Comic Sans MS', sans-serif; }
        canvas { display: block; cursor: none; }
        #ui {
            position: absolute;
            top: 20px;
            width: 100%;
            text-align: center;
            font-size: clamp(24px, 5vw, 40px);
            font-weight: bold;
            color: #ff69b4; /* Pink für Ella */
            text-shadow: 2px 2px 0px #fff, -2px -2px 0px #fff, 2px -2px 0px #fff, -2px 2px 0px #fff;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div id="ui">Nüsse für Ella: <span id="score">0</span></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');

        // BILDER LADEN
        const imgWald = new Image(); imgWald.src = 'wald.png';
        const imgEich = new Image(); imgEich.src = 'eichhörnchen-removebg-preview.png';
        const imgNuss = new Image(); imgNuss.src = 'haselnuss-removebg-preview.png';
        const imgKrone = new Image(); imgKrone.src = 'krone pink.png';

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0;
        let squirrel = {
            x: canvas.width / 2,
            y: 0,
            w: 120, // Größe angepasst
            h: 120,
            targetX: canvas.width / 2
        };

        let items = [];

        // Steuerung
        const handleMove = (e) => {
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            squirrel.targetX = clientX;
        };
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchstart', handleMove);

        function spawnItem() {
            const isKrone = Math.random() < 0.2; // 20% Chance auf eine Krone
            items.push({
                x: Math.random() * (canvas.width - 60),
                y: -100,
                type: isKrone ? 'krone' : 'nuss',
                speed: 3 + Math.random() * 4,
                size: isKrone ? 70 : 60
            });
        }

        function update() {
            squirrel.y = canvas.height - 150; // Immer am unteren Rand
            squirrel.x += (squirrel.targetX - squirrel.x) * 0.15; // Weiche Bewegung

            for (let i = items.length - 1; i >= 0; i--) {
                let it = items[i];
                it.y += it.speed;

                // Kollision
                if (it.y + it.size > squirrel.y + 20 &&
                    it.x < squirrel.x + squirrel.w/2 &&
                    it.x + it.size > squirrel.x - squirrel.w/2) {
                    
                    score += (it.type === 'krone' ? 5 : 1);
                    scoreElement.innerText = score;
                    items.splice(i, 1);
                    
                    // Ein kleiner Sound-Trick ohne externe Datei
                    playSimpleTone();
                } else if (it.y > canvas.height) {
                    items.splice(i, 1);
                }
            }
            if (Math.random() < 0.02) spawnItem();
        }

        function draw() {
            // 1. Hintergrund
            ctx.drawImage(imgWald, 0, 0, canvas.width, canvas.height);

            // 2. Items
            items.forEach(it => {
                const img = it.type === 'krone' ? imgKrone : imgNuss;
                ctx.drawImage(img, it.x, it.y, it.size, it.size);
            });

            // 3. Ella's Eichhörnchen
            ctx.drawImage(imgEich, squirrel.x - squirrel.w/2, squirrel.y, squirrel.w, squirrel.h);

            update();
            requestAnimationFrame(draw);
        }

        // Einfacher Soundeffekt (Web Audio API)
        function playSimpleTone() {
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        }

        draw();
    </script>
</body>
</html>
