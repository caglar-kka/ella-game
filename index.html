<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ellas Eichhörnchen-Abenteuer</title>
    <style>
        body { 
            margin: 0; padding: 0; overflow: hidden; background: #87CEEB; touch-action: none; 
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; 
        }
        canvas { display: block; }
        
        #ui {
            position: absolute; top: 50px; width: 100%;
            display: flex; justify-content: space-between; padding: 0 20px; box-sizing: border-box;
            font-size: clamp(20px, 4vw, 30px); font-weight: bold; color: #ff69b4; 
            text-shadow: 2px 2px 0px #fff; pointer-events: none; z-index: 10;
        }

        #stopButton {
            position: absolute; top: 50px; right: 20px; 
            background: #ff4444; color: white; border: 3px solid white; border-radius: 50%;
            width: 50px; height: 50px; font-size: 25px; font-weight: bold; cursor: pointer;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3); z-index: 100;
            display: none; align-items: center; justify-content: center; font-family: sans-serif;
        }

        .overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.92); 
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 20; text-align: center; padding: 20px; box-sizing: border-box;
        }
        h1 {
            font-size: clamp(35px, 8vw, 60px); color: #ff1493; margin: 0;
            text-shadow: 3px 3px 0px #fff; animation: bounce 1s infinite alternate;
        }
        p { font-size: 20px; color: #333; margin: 10px; }
        
        #startImage {
            width: 180px; height: 180px; object-fit: cover; 
            border-radius: 50%; border: 6px solid #ff69b4; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.2); margin: 15px 0;
            background-color: #ddd; 
        }

        button.menu-btn {
            background: #ff69b4; color: white; border: 4px solid #fff;
            padding: 15px 30px; font-size: 24px; border-radius: 50px;
            font-family: inherit; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s; margin-top: 10px;
        }
        button.menu-btn:active { transform: scale(0.95); }
        @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.1); } }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <audio id="bgMusic" loop><source src="musik.mp3" type="audio/mpeg"></audio>
    <button id="stopButton" onclick="stopGame()">X</button>

    <div id="ui">
        <div>Punkte: <span id="score">0</span></div>
        <div style="margin-right: 60px;">Rekord: <span id="highscore">0</span></div> 
    </div>

    <div id="startScreen" class="overlay">
        <h1>Hallo Ella!</h1>
        <img id="startImage" src="ella.jpg" alt="Ella" onerror="this.style.display='none'">
        <p>Fang die Nüsse & Dayi!</p>
        <button class="menu-btn" onclick="startGame()">Los geht's ▶</button>
    </div>

    <div id="milestoneScreen" class="overlay hidden">
        <h1>SUPER!</h1>
        <p><span id="milestoneScore">100</span> Punkte erreicht!</p>
        <button class="menu-btn" onclick="continueGame()">Weiter spielen ↺</button>
        <br>
        <button class="menu-btn" style="background:#ff4444; font-size:18px; padding:10px 20px;" onclick="stopGame()">Beenden</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const highscoreEl = document.getElementById('highscore');
        const milestoneScreen = document.getElementById('milestoneScreen');
        const milestoneText = document.getElementById('milestoneScore');
        const startScreen = document.getElementById('startScreen');
        const stopBtn = document.getElementById('stopButton');
        const music = document.getElementById('bgMusic');

        // BILDER LADEN
        const imgWald = new Image(); imgWald.src = 'wald.png';
        const imgEich = new Image(); imgEich.src = 'eich.png';
        const imgNuss = new Image(); imgNuss.src = 'nuss.png';
        const imgKrone = new Image(); imgKrone.src = 'krone.png';
        const imgDayi = new Image(); imgDayi.src = 'dayi.jpg'; 

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        let score = 0;
        let highscore = localStorage.getItem('ella_highscore') || 0;
        let gameRunning = false;
        let nextMilestone = 100; 
        let showHeart = false;
        let heartTimer = 0;

        highscoreEl.innerText = highscore;

        let squirrel = { x: canvas.width / 2, y: 0, w: 150, h: 150, targetX: canvas.width / 2 };
        let items = [];

        const handleMove = (e) => {
            if (!gameRunning) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            squirrel.targetX = clientX;
        };
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove, {passive: false});
        window.addEventListener('touchstart', handleMove, {passive: false});

        function startGame() {
            startScreen.classList.add('hidden');
            milestoneScreen.classList.add('hidden');
            stopBtn.style.display = "flex";
            score = 0;
            nextMilestone = 100;
            scoreEl.innerText = score;
            items = [];
            gameRunning = true;
            showHeart = false;
            music.currentTime = 0; music.volume = 0.4;
            music.play().catch(e => console.log("Audio braucht User-Interaktion"));
            loop();
        }

        function stopGame() {
            gameRunning = false;
            stopBtn.style.display = "none";
            milestoneScreen.classList.add('hidden');
            startScreen.classList.remove('hidden');
            music.pause();
        }

        function showMilestone() {
            gameRunning = false; 
            milestoneText.innerText = score;
            milestoneScreen.classList.remove('hidden');
            stopBtn.style.display = "none";
            playTone(600, "triangle", 0.3); playTone(800, "sine", 0.3);
        }

        function continueGame() {
            milestoneScreen.classList.add('hidden');
            stopBtn.style.display = "flex";
            gameRunning = true;
            nextMilestone += 100; 
            loop();
        }

        function spawnItem() {
            if (!gameRunning) return;
            const rand = Math.random();
            let type, size;

            // WAHRSCHEINLICHKEITEN
            // Jetzt nur noch 5% Chance für Dayi (0.05) - also sehr selten!
            if (rand < 0.05) { 
                type = 'dayi'; 
                size = 100; // GRÖSSER (war 70, jetzt 100)
            } 
            else if (rand < 0.30) { type = 'krone'; size = 80; } 
            else { type = 'nuss'; size = 70; }

            items.push({
                x: Math.random() * (canvas.width - 60),
                y: -100,
                type: type,
                speed: (1.2 + Math.random() * 1.5) * (canvas.height / 800), 
                size: size
            });
        }

        function update() {
            if (!gameRunning) return;
            const safeBottom = Math.max(180, canvas.height * 0.2);
            squirrel.y = canvas.height - safeBottom; 
            squirrel.x += (squirrel.targetX - squirrel.x) * 0.1;

            if (showHeart) {
                heartTimer--;
                if(heartTimer <= 0) showHeart = false;
            }

            for (let i = items.length - 1; i >= 0; i--) {
                let it = items[i];
                it.y += it.speed;

                if (it.y + it.size > squirrel.y + 30 &&
                    it.x < squirrel.x + squirrel.w/2 &&
                    it.x + it.size > squirrel.x - squirrel.w/2) {
                    
                    if (it.type === 'dayi') {
                        score += 50; 
                        playTone(1000, "sine", 0.5); 
                        showHeart = true;
                        heartTimer = 80; 
                    } else if (it.type === 'krone') {
                        score += 20;
                        playTone(800, "sine", 0.2);
                    } else {
                        score += 5;
                        playTone(500, "sine", 0.1);
                    }

                    scoreEl.innerText = score;
                    items.splice(i, 1);

                    if (score > highscore) {
                        highscore = score;
                        localStorage.setItem('ella_highscore', highscore);
                        highscoreEl.innerText = highscore;
                    }
                    if (score >= nextMilestone) showMilestone();

                } else if (it.y > canvas.height) {
                    items.splice(i, 1);
                }
            }
            if (Math.random() < 0.015) spawnItem();
        }

        function drawHeart() {
             ctx.font = "120px Arial";
             ctx.textAlign = "center";
             ctx.fillText("❤️", squirrel.x, squirrel.y - 60);
             ctx.fillStyle = "white";
             ctx.font = "bold 40px Arial";
             ctx.fillText("+50", squirrel.x, squirrel.y - 100);
        }

        function loop() {
            if (!gameRunning) return;

            try {
                if (imgWald.complete && imgWald.naturalWidth > 0) {
                    ctx.drawImage(imgWald, 0, 0, canvas.width, canvas.height);
                } else {
                    ctx.fillStyle = "#87CEEB"; ctx.fillRect(0, 0, canvas.width, canvas.height);
                }

                items.forEach(it => {
                    let img;
                    if (it.type === 'krone') img = imgKrone;
                    else if (it.type === 'dayi') {
                        img = imgDayi;
                        if (img.complete && img.naturalWidth > 0) {
                            ctx.save();
                            ctx.beginPath();
                            ctx.arc(it.x + it.size/2, it.y + it.size/2, it.size/2, 0, Math.PI*2);
                            ctx.closePath();
                            ctx.lineWidth = 3; 
                            ctx.strokeStyle = "white";
                            ctx.stroke();
                            ctx.clip();
                            ctx.drawImage(img, it.x, it.y, it.size, it.size);
                            ctx.restore();
                        } else {
                            ctx.fillStyle = "purple";
                            ctx.beginPath();
                            ctx.arc(it.x + it.size/2, it.y + it.size/2, it.size/2, 0, Math.PI*2);
                            ctx.fill();
                            ctx.fillStyle = "white";
                            ctx.font = "bold 30px Arial";
                            ctx.textAlign = "center";
                            ctx.fillText("D", it.x + it.size/2, it.y + it.size/2 + 10);
                        }
                        return; 
                    }
                    else img = imgNuss;

                    if (img.complete && img.naturalWidth > 0) {
                        ctx.drawImage(img, it.x, it.y, it.size, it.size);
                    } else {
                        ctx.fillStyle = "#8B4513";
                        ctx.beginPath();
                        ctx.arc(it.x + it.size/2, it.y + it.size/2, it.size/2, 0, Math.PI*2);
                        ctx.fill();
                    }
                });

                if (imgEich.complete && imgEich.naturalWidth > 0) {
                    ctx.drawImage(imgEich, squirrel.x - squirrel.w/2, squirrel.y, squirrel.w, squirrel.h);
                }

                if (showHeart) drawHeart();

                update();
            } catch (error) {
                requestAnimationFrame(loop);
                return;
            }
            requestAnimationFrame(loop);
        }
        
        function drawStatic() {
            if (imgWald.complete) ctx.drawImage(imgWald, 0, 0, canvas.width, canvas.height);
            if (!gameRunning) requestAnimationFrame(drawStatic);
        }
        drawStatic();

        function playTone(freq, type, duration) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.start(); osc.stop(audioCtx.currentTime + duration + 0.05);
            } catch(e) {}
        }
    </script>
</body>
</html>
