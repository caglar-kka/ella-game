<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ellas Eichhörnchen-Abenteuer</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            overflow: hidden; 
            background: #87CEEB; 
            touch-action: none; 
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif; 
        }
        canvas { display: block; }
        
        /* UI für Punkte oben */
        #ui {
            position: absolute;
            top: 15px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 20px;
            box-sizing: border-box;
            font-size: clamp(20px, 4vw, 30px);
            font-weight: bold;
            color: #ff69b4; 
            text-shadow: 2px 2px 0px #fff;
            pointer-events: none;
            z-index: 10;
        }

        /* Der Start- und Gewonnen-Bildschirm */
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.85);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            text-align: center;
        }

        h1 {
            font-size: clamp(40px, 8vw, 70px);
            color: #ff1493;
            margin: 0;
            text-shadow: 3px 3px 0px #fff, 5px 5px 0px rgba(0,0,0,0.1);
            animation: bounce 1s infinite alternate;
        }

        p {
            font-size: 24px;
            color: #333;
            margin: 20px;
        }

        button {
            background: #ff69b4;
            color: white;
            border: 4px solid #fff;
            padding: 15px 40px;
            font-size: 30px;
            border-radius: 50px;
            font-family: inherit;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        button:active { transform: scale(0.95); }

        /* Kleine Animation für den Text */
        @keyframes bounce {
            from { transform: scale(1); }
            to { transform: scale(1.1); }
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="ui">
        <div>Punkte: <span id="score">0</span></div>
        <div>Rekord: <span id="highscore">0</span></div>
    </div>

    <div id="startScreen" class="overlay">
        <h1>Hallo Ella!</h1>
        <p>Hilf dem Eichhörnchen Nüsse zu sammeln.</p>
        <button onclick="startGame()">Starten ▶</button>
    </div>

    <div id="winScreen" class="overlay hidden">
        <h1>GEWONNEN!</h1>
        <p>Du bist super!</p>
        <p>Deine Punkte: <span id="finalScore">0</span></p>
        <button onclick="restartGame()">Nochmal spielen ↺</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreElement = document.getElementById('score');
        const highscoreElement = document.getElementById('highscore');
        const winScreen = document.getElementById('winScreen');
        const startScreen = document.getElementById('startScreen');

        // BILDER LADEN
        const imgWald = new Image(); imgWald.src = 'wald.png';
        const imgEich = new Image(); imgEich.src = 'eich.png';
        const imgNuss = new Image(); imgNuss.src = 'nuss.png';
        const imgKrone = new Image(); imgKrone.src = 'krone.png';

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // SPIEL VARIABLEN
        let score = 0;
        let highscore = localStorage.getItem('ella_highscore') || 0;
        let gameRunning = false;
        let winScore = 100; // Ziel: 100 Punkte zum Gewinnen

        highscoreElement.innerText = highscore;

        let squirrel = { x: canvas.width / 2, y: 0, w: 100, h: 100, targetX: canvas.width / 2 };
        let items = [];

        // STEUERUNG
        const handleMove = (e) => {
            if (!gameRunning) return;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            squirrel.targetX = clientX;
        };
        window.addEventListener('mousemove', handleMove);
        window.addEventListener('touchmove', handleMove, {passive: false});
        window.addEventListener('touchstart', handleMove, {passive: false});

        function startGame() {
            startScreen.classList.add('hidden');
            winScreen.classList.add('hidden');
            score = 0;
            scoreElement.innerText = score;
            items = [];
            gameRunning = true;
            playTone(400, "sine"); // Start-Ton
            loop();
        }

        function restartGame() {
            startGame();
        }

        function gameOver() {
            gameRunning = false;
            winScreen.classList.remove('hidden');
            document.getElementById('finalScore').innerText = score;
            playTone(600, "triangle"); // Gewonnen-Ton
            
            // Highscore speichern
            if (score > highscore) {
                highscore = score;
                localStorage.setItem('ella_highscore', highscore);
                highscoreElement.innerText = highscore;
            }
        }

        function spawnItem() {
            if (!gameRunning) return;
            const isKrone = Math.random() < 0.25; // Etwas mehr Kronen (25%)
            items.push({
                x: Math.random() * (canvas.width - 60),
                y: -100,
                type: isKrone ? 'krone' : 'nuss',
                // VIEL LANGSAMER: Speed zwischen 1.5 und 3.5 (angepasst an Bildschirmhöhe)
                speed: (1.5 + Math.random() * 2) * (canvas.height / 800), 
                size: isKrone ? 80 : 70
            });
        }

        function update() {
            if (!gameRunning) return;

            squirrel.y = canvas.height - 140;
            squirrel.x += (squirrel.targetX - squirrel.x) * 0.1;

            for (let i = items.length - 1; i >= 0; i--) {
                let it = items[i];
                it.y += it.speed;

                // Kollision
                if (it.y + it.size > squirrel.y + 20 &&
                    it.x < squirrel.x + squirrel.w/2 &&
                    it.x + it.size > squirrel.x - squirrel.w/2) {
                    
                    // NEUE PUNKTE: 20 für Krone, 5 für Nuss
                    score += (it.type === 'krone' ? 20 : 5);
                    scoreElement.innerText = score;
                    items.splice(i, 1);
                    playTone(it.type === 'krone' ? 800 : 500, "sine"); // Hoher Ton für Krone

                    // GEWONNEN PRÜFEN
                    if (score >= winScore) {
                        gameOver();
                    }

                } else if (it.y > canvas.height) {
                    items.splice(i, 1);
                }
            }

            // Weniger Items spawnen (langsamerer Rhythmus)
            if (Math.random() < 0.015) spawnItem();
        }

        function loop() {
            if (!gameRunning) return; // Stoppt die Schleife wenn Spiel vorbei

            // Zeichnen
            if (imgWald.complete && imgWald.naturalWidth !== 0) {
                ctx.drawImage(imgWald, 0, 0, canvas.width, canvas.height);
            } else {
                ctx.fillStyle = "#87CEEB"; ctx.fillRect(0, 0, canvas.width, canvas.height);
            }

            items.forEach(it => {
                const img = it.type === 'krone' ? imgKrone : imgNuss;
                if (img.complete) ctx.drawImage(img, it.x, it.y, it.size, it.size);
            });

            if (imgEich.complete) {
                ctx.drawImage(imgEich, squirrel.x - squirrel.w/2, squirrel.y, squirrel.w, squirrel.h);
            }

            update();
            requestAnimationFrame(loop);
        }

        // Einmaliges Zeichnen für den Startbildschirm-Hintergrund
        function drawStaticBackground() {
            if (imgWald.complete) ctx.drawImage(imgWald, 0, 0, canvas.width, canvas.height);
            requestAnimationFrame(drawStaticBackground);
        }
        drawStaticBackground(); // Damit man den Wald hinter dem Startmenü sieht

        // Einfacher Sound
        function playTone(freq, type) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain); gain.connect(audioCtx.destination);
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start(); osc.stop(audioCtx.currentTime + 0.15);
            } catch(e) {}
        }
    </script>
</body>
</html>
